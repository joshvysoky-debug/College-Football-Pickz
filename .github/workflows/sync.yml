name: Sync CFB scores
on:
  schedule:
    # Every 3 hours, Sunday-Friday (UTC)
    - cron: '0 */3 * * 0-5'
    # Every 10 minutes on Saturday (UTC)
    - cron: '*/10 * * * 6'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: curl -sf "https://cfbgametime.vercel.app/api/sync?secret=${{ secrets.CRON_SECRET }}"
