name: Sync CFB scores
on:
  schedule:
    # Every 3 hours, Sunday-Friday (UTC)
    - cron: '0 */3 * * 0-5'
    # Every 5 minutes on Saturday (UTC). GitHub Actions doesn't reliably
    # honor schedules tighter than ~5 minutes (it queues and can silently
    # skip runs under load), so this is close to the practical floor for
    # a free/cron-based setup — good enough for a live quarter/clock badge
    # to feel current without claiming second-by-second accuracy.
    - cron: '*/5 * * * 6'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: curl -sf "https://cfbgametime.vercel.app/api/sync?secret=${{ secrets.CRON_SECRET }}"
